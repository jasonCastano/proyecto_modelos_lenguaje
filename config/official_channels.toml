# Official channels only: YouTube, Instagram and Linktree.
# Instagram is retained so the pipeline records its robots/ToS exclusion.

[settings]
data_root = "data"
storage_limit_bytes = 10000000000
user_agent = "ManuelitaRAG/0.1 (academic research; +https://github.com/jasonCastano/proyecto_modelos_lenguaje)"
contact = "jasonale3007@gmail.com"
max_concurrency = 1
max_per_host = 1
default_delay_seconds = 2.0
max_depth = 0
request_timeout_seconds = 45
max_retries = 2
retry_backoff_seconds = 2.0
allowed_media_types = [
  "text/html",
  "application/json",
  "application/xml",
  "text/plain",
  "text/vtt",
  "application/pdf",
]

[[sources]]
