# Fundación Manuelita: first-party site linked from the official Linktree.
# Separate domain, so it needs its own bronze campaign.

[settings]
data_root = "data"
storage_limit_bytes = 10000000000
user_agent = "ManuelitaRAG/0.1 (academic research; +https://github.com/jasonCastano/proyecto_modelos_lenguaje)"
contact = "jasonale3007@gmail.com"
max_concurrency = 1
max_per_host = 1
default_delay_seconds = 1.5
max_depth = 2
request_timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 2.0
allowed_media_types = [
  "text/html",
  "application/pdf",
  "application/xml",
  "application/json",
  "text/plain",
]

[[sources]]
id = "fundacion_manuelita"
domain = "fundacionmanuelita.org"
platform = "website"
authority = "first_party"
enabled = true
priority = 2
seeds = ["https://fundacionmanuelita.org/"]
sitemaps = ["https://fundacionmanuelita.org/sitemap_index.xml"]
follow_links = true
max_depth = 2
category_hints = ["identity", "digital_presence"]

[sources.policy]
robots = "respect"
requires_auth = false
excluded_paths = ["/wp-admin", "/wp-includes", "/feed", "/comments"]

[sources.rate_limit]
delay_seconds = 1.5
max_concurrency = 1
