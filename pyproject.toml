[project]
name = "proyecto-modelos-lenguaje"
version = "0.1.0"
description = "Sistema Q&A y RAG sobre información pública de Ingenio Manuelita"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jason Alejandro Castaño", email = "jasonale3007@gmail.com" },
    { name = "Roberto José Guerrero" },
]
requires-python = ">=3.14"
dependencies = [
    "av>=14,<20",  # spec 023: decodificación de audio de faster-whisper
    "cryptography>=3.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "faster-whisper>=1.2.1",  # spec 023: dictado local (ADR 0027)
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=6.1",
    "matplotlib>=3.10",  # spec 024: figura de la proyección t-SNE (R16)
    "mcp>=1.20",  # spec 024: servidor MCP propio valeria-tools (R10)
    "numpy>=2.5.4",
    "openpyxl>=3.1",
    "ptts>=0.7.1",
    "pypdf>=6.21",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "qdrant-client>=1.15",
    "scikit-learn>=1.7",  # spec 024: t-SNE de los embeddings (R16)
    "scrapling[fetchers]>=0.5",
    "trafilatura>=2.3",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
# Spec 023: faster-whisper y av pasaron a runtime (dictado); la extra queda como alias vacío
# para que `uv run --extra asr` de scripts/transcribe_youtube.py siga funcionando.
asr = []

[project.urls]
Repository = "https://github.com/jasonCastano/proyecto_modelos_lenguaje"
Issues = "https://github.com/jasonCastano/proyecto_modelos_lenguaje/issues"

[project.scripts]
pml = "proyecto_modelos_lenguaje.cli:main"
proyecto-modelos-lenguaje = "proyecto_modelos_lenguaje.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "jsonschema>=4.26.0",
    "playwright>=1.64",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network and not voice'"
markers = [
    "network: requiere red o claves (Ragas, LangSmith, DeepSeek); excluida por defecto y en CI",
    "voice: requiere el modelo Phonon descargado (HF_TOKEN); excluida por defecto y en CI",
]
filterwarnings = ["ignore::DeprecationWarning"]
