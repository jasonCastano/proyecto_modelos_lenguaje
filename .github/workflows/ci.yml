name: CI

on:
  push:
    branches:
      [
        "main",
        "001-bronze-web-scraping",
        "003-silver-medallion-layer",
        "004-gold-medallion-layer",
        "005-scrape-empresa-entrypoint",
        "008-streamlit-qa-app",
        "010-metrics-panel-layout",
      ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Scrape entrypoint help
        run: uv run python scripts/scrape_empresa.py --help

      - name: App smoke
        run: PML_DEMO=1 uv run pytest tests/integration/test_app_streamlit.py -q

      - name: Gold contracts
        run: uv run pytest tests/contract/gold -q

      - name: Build
        run: uv build
