# Qdrant servidor para la demo del Módulo 2 (rúbrica 2.2): índice HNSW real (ANN) y
# filtros por payload indexados. Sin servidor, la app usa el modo local embebido (búsqueda exacta).
#
#   docker compose up -d qdrant          # o: make qdrant-up
#   export QDRANT_URL=http://localhost:6333
#   uv run python -m proyecto_modelos_lenguaje.rag qdrant build --force
#   uv run python -m proyecto_modelos_lenguaje.rag qdrant status   # muestra hnsw_ef y latencia
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
