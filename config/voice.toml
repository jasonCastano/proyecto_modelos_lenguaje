# Voz del agente (spec 016): síntesis local con Phonon (paquete `ptts`).
# Las variables MANUELITA_VOICE_ENABLED, MANUELITA_VOICE_ENGINE, MANUELITA_VOICE y
# MANUELITA_VOICE_WARMUP tienen prioridad sobre este archivo.
# Licencia del modelo y las voces: CC BY-NC 4.0 (uso académico, no comercial).

[voice]
enabled = true
engine = "phonon"                       # "phonon" | "fake"
model = "hf://gradium/phonon-40m-es"
language = "es"
quant = "q8_0"                          # ptts.available_quants(): f32, q8_0, q8k, q6k, q5k, q4k, …
voice = "Rebeca"                        # voz oficial (T037): femenina, español de México (id Sx8m6WdXBG06zwZT)
voice_gender = "female"
max_chars = 600
warmup = true

# Spec 028 (research R4): voz en inglés para las notas de voz de WhatsApp. Modelo por defecto de
# Phonon en inglés (37 voces); la voz definitiva se elige en la prueba técnica (Harper, Everly o
# Juniper). Misma licencia CC BY-NC 4.0; requiere aceptar las condiciones en Hugging Face.
[voice.languages.en]
model = "hf://gradium/phonon-31m-en"
voice = "Harper"
quant = "q8_0"
voice_gender = "female"
