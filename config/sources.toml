# Source configuration for the Manuelita bronze layer.
# Domains and seeds are public entry points; the pipeline enforces robots.txt,
# per-host limits and the manual exclusions in exclusions.toml.

[settings]
data_root = "data"
storage_limit_bytes = 10000000000
user_agent = "ManuelitaRAG/0.1 (academic research; +https://github.com/)"
contact = "jasonale3007@gmail.com"
max_concurrency = 8
max_per_host = 2
default_delay_seconds = 1.5
max_depth = 3
request_timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 2.0
allowed_media_types = [
  "text/html",
  "application/pdf",
  "application/xml",
  "application/json",
  "text/plain",
  "text/vtt",
  "text/csv",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
]

[[sources]]
id = "official_site"
domain = "manuelita.com"
platform = "website"
authority = "first_party"
enabled = true
priority = 0
seeds = ["https://www.manuelita.com/"]
sitemaps = ["https://www.manuelita.com/sitemap.xml"]
follow_links = true
max_depth = 2
category_hints = ["identity", "offer", "digital_presence", "hard_data"]

[sources.policy]
robots = "respect"
requires_auth = false
excluded_paths = ["/wp-admin", "/wp-includes", "/trackback", "/feed", "/comments"]

[sources.rate_limit]
delay_seconds = 1.5
max_concurrency = 2

