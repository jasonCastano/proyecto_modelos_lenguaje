name: CI

on:
  push:
    branches:
      [
        "main",
        "001-bronze-web-scraping",
        "003-silver-medallion-layer",
        "004-gold-medallion-layer",
        "005-scrape-empresa-entrypoint",
        "008-streamlit-qa-app",
        "010-metrics-panel-layout",
        "012-manuelita-rag-showcase",
      ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Scrape entrypoint help
        run: uv run python scripts/scrape_empresa.py --help

      - name: Gold contracts
        run: uv run pytest tests/contract/gold -q

      - name: Build
        run: uv build

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web tests
        working-directory: web
        run: npm run test

      - name: Web build
        working-directory: web
        run: npm run build
