# Metadata-only YouTube backfill to record manual/automatic subtitle kinds.

[settings]
data_root = "data"
storage_limit_bytes = 10000000000
user_agent = "ManuelitaRAG/0.1 (academic research; +https://github.com/jasonCastano/proyecto_modelos_lenguaje)"
contact = "jasonale3007@gmail.com"
max_concurrency = 1
max_per_host = 1
default_delay_seconds = 2.0
max_depth = 0
request_timeout_seconds = 45
max_retries = 2
retry_backoff_seconds = 2.0
allowed_media_types = [
  "application/json",
  "text/vtt",
]

[[sources]]
id = "youtube"
domain = "youtube.com"
platform = "youtube"
authority = "first_party"
enabled = true
priority = 2
seeds = ["https://www.youtube.com/@ManuelitaAgroindustria"]
follow_links = false
max_depth = 0
category_hints = ["digital_presence"]

[sources.policy]
robots = "respect"
requires_auth = false

[sources.rate_limit]
delay_seconds = 2.0
max_concurrency = 1
