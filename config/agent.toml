# Configuración del agente RAG con memoria y enrutador (spec 014).
# La lee src/proyecto_modelos_lenguaje/agent/config.py; los valores vienen de research.md.

[router]
min_confidence = 0.6      # por debajo, la ruta efectiva es «clarify» (FR-015)
llm_temperature = 0.0

[agent]
tool_call_limit = 3       # búsquedas máximas por turno (ToolCallLimitMiddleware)
model_call_limit = 5      # llamadas máximas al modelo por turno (ModelCallLimitMiddleware)
chain_top_k = 8           # fragmentos que recupera siempre la variante cadena

[memory]
summarize_after_tokens = 6000
keep_last_messages = 6
preference_ttl_days = 30

[structured]
path = "data/module2/structured"   # vista derivada del oro; solo la escribe el CLI

[care]                     # habilidades de atención de Valer-IA (spec 019)
enabled = true            # false: respuestas fijas de prompts/conduct.md (línea base)
max_requests = 5          # solicitudes atendidas por mensaje
hostility_levels = 3      # niveles del límite cordial ante insultos
complaint_escalation = 3  # quejas seguidas antes de ofrecer el canal oficial

[conversation]             # conversación natural guiada (spec 020)
mode = "guided"           # guided: el modelo redacta y la revisión controla; scripted: guiones de la spec 019
temperature_social = 0.8  # turnos sin búsqueda (nodo converse)
temperature_facts = 0.3   # respuestas con evidencia de Manuelita
presence_penalty = 0.3    # se omiten si el proveedor no las acepta
frequency_penalty = 0.3
bridge_every = 2          # como máximo un puente cada dos turnos fuera de tema
bridge_min_score = 0.2    # puntaje mínimo del retriever para un puente buscado
repetition_threshold = 0.5  # similitud máxima con las respuestas recientes del hilo
recent_window = 10        # respuestas del hilo que se comparan (SC-001: todo el hilo)
max_regenerations = 1     # regeneraciones tras la revisión antes del respaldo
converse_max_tokens = 220
converse_timeout_seconds = 8
review_llm = false        # juez LLM en línea (desactivado por latencia)
delivery = "sentences"    # spec 021: frases revisadas una por una; complete: respuesta entera (spec 020)
sentence_max_chars = 220  # fragmento máximo sin cierre de frase
first_fragment_chars = 160  # el primer fragmento llega antes
stream_first_timeout_seconds = 8  # espera máxima hasta el primer texto del modelo
stream_idle_timeout_seconds = 6   # espera máxima sin texto nuevo a mitad de la respuesta

[state]
env_var = "MANUELITA_STATE_DIR"    # checkpointer y Store, siempre fuera del repositorio
