# Estilo caleño de Valer-IA (spec 036): expresiones de Santiago de Cali aptas para atención al cliente.
# Las lee src/proyecto_modelos_lenguaje/agent/style.py. El trato es tuteo (nunca voseo) y el perfil es
# siempre profesional: como máximo una expresión por respuesta escrita y dos por nota de voz.
# Los textos se comparan sin tildes ni mayúsculas, salvo el voseo (match = "voseo"), que exige la
# tilde aguda («mirá», «sabés»).
# Niveles: "informal" (visitante coloquial), "neutral" (caso común) y "formal" (marcas de cortesía formal).
# Sin estilo («off»): inglés, quejas, molestia, angustia, crisis, textos fijos o si piden hablar normal.

[style]
enabled = true
max_written = 1          # expresiones por respuesta escrita (FR-003)
max_spoken = 2           # expresiones por guion hablado (FR-003)
suggestions = 3          # expresiones sugeridas por turno
memory = 3               # últimas expresiones recordadas para no repetir (FR-004)
# Frases con las que la persona pide hablar sin modismos (FR-009); se comparan sin tildes.
opt_out = [
    "habla normal", "hablame normal", "habla normalito", "sin acento", "sin modismos",
    "sin jerga", "no hables asi", "deja el acento", "speak normally", "without slang",
]
# Marcas de registro formal (FR-005): con ellas solo se sugieren cortesías de nivel formal.
formal_markers = [
    "buenos dias", "buenas tardes", "buenas noches", "usted", "quisiera", "solicito", "cordial",
    "estimado", "estimada", "agradezco", "le agradeceria", "me permito",
]

# ---------------------------------------------------------------- expresiones aprobadas

[[approved]]
text = "ve"
match = "interjection"   # solo «¡Ve, …!» o «…, ve»: no cuenta en «ve a la página»
meaning = "interjección caleña para llamar la atención con cariño, como «oye»"
levels = ["informal", "neutral"]
spoken = true
example = "¡Ve, qué buena pregunta!"

[[approved]]
text = "qué bueno, ve"
meaning = "expresión caleña de alegría, como «qué bueno»"
levels = ["informal", "neutral"]
spoken = true
example = "Qué bueno, ve, te cuento lo que hace Manuelita."

[[approved]]
text = "listo pues"
meaning = "acuerdo o cierre amable, como «de acuerdo»"
levels = ["informal", "neutral"]
spoken = true
example = "Listo pues, aquí te dejo el dato."

[[approved]]
text = "a la orden"
meaning = "disposición a servir, muy usada en el comercio caleño"
levels = ["informal", "neutral", "formal"]
spoken = true
example = "A la orden para lo que necesites de Manuelita."

[[approved]]
text = "con mucho gusto"
meaning = "cortesía al ayudar, típica de la atención en Cali"
levels = ["informal", "neutral", "formal"]
spoken = true
example = "Con mucho gusto te cuento."

[[approved]]
text = "uy, qué nota"
meaning = "entusiasmo, como «qué bien»"
levels = ["informal"]
spoken = true
example = "¡Uy, qué nota que preguntes por eso!"

[[approved]]
text = "bien pueda"
meaning = "invitación cortés, como «adelante, con confianza»"
levels = ["informal", "neutral", "formal"]
spoken = true
example = "Bien pueda, pregúntame lo que quieras de Manuelita."

[[approved]]
text = "de una"
meaning = "aceptación inmediata, como «claro, enseguida»"
levels = ["informal"]
spoken = true
example = "De una, te cuento."

[[approved]]
text = "chévere"
meaning = "agrado, como «qué bien» o «qué bueno»"
levels = ["informal", "neutral"]
spoken = true
example = "Qué chévere que te interese."

[[approved]]
text = "de ñapa"
meaning = "«de ñapa»: algo extra que se da de regalo, como «de yapa»"
levels = ["informal", "neutral"]
spoken = false           # el motor de voz la pronuncia con riesgo; solo por escrito
example = "Y de ñapa, te cuento que también produce energía."

[[approved]]
text = "pues"
match = "closing"        # solo como cierre de frase: «Ahí te cuento, pues.»
suggest = false          # se permite, pero no se sugiere (muletilla si se repite)
meaning = "cierre enfático y amable al final de la frase"
levels = ["informal", "neutral"]
spoken = true
example = "Ahí te cuento, pues."

[[approved]]
text = "sucursal del cielo"
suggest = false          # solo si la persona habla de Cali
meaning = "apodo cariñoso de Cali"
levels = ["informal", "neutral"]
spoken = true
example = "Desde la sucursal del cielo, te cuento de Manuelita."

