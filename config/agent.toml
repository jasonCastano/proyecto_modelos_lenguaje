# Configuración del agente RAG con memoria y enrutador (spec 014).
# La lee src/proyecto_modelos_lenguaje/agent/config.py; los valores vienen de research.md.

[router]
min_confidence = 0.6      # por debajo, la ruta efectiva es «clarify» (FR-015)
llm_temperature = 0.0

[agent]
tool_call_limit = 3       # búsquedas máximas por turno (ToolCallLimitMiddleware)
model_call_limit = 5      # llamadas máximas al modelo por turno (ModelCallLimitMiddleware)
chain_top_k = 8           # fragmentos que recupera siempre la variante cadena

[agent.route_limits.planning]  # spec 025 (R4): estado, compromisos, optimizar y simular la alternativa
tool_call_limit = 5
model_call_limit = 6

[memory]
summarize_after_tokens = 6000
keep_last_messages = 6
preference_ttl_days = 30

[structured]
path = "data/module2/structured"   # vista derivada del oro; solo la escribe el CLI

[care]                     # habilidades de atención de Valer-IA (spec 019)
enabled = true            # false: respuestas fijas de prompts/conduct.md (línea base)
max_requests = 5          # solicitudes atendidas por mensaje
hostility_levels = 3      # niveles del límite cordial ante insultos
complaint_escalation = 3  # quejas seguidas antes de ofrecer el canal oficial

[conversation]             # conversación natural guiada (spec 020)
mode = "guided"           # guided: el modelo redacta y la revisión controla; scripted: guiones de la spec 019
temperature_social = 0.8  # turnos sin búsqueda (nodo converse)
temperature_facts = 0.3   # respuestas con evidencia de Manuelita
presence_penalty = 0.3    # se omiten si el proveedor no las acepta
frequency_penalty = 0.3
bridge_every = 2          # como máximo un puente cada dos turnos fuera de tema
bridge_min_score = 0.2    # puntaje mínimo del retriever para un puente buscado
repetition_threshold = 0.5  # similitud máxima con las respuestas recientes del hilo
recent_window = 10        # respuestas del hilo que se comparan (SC-001: todo el hilo)
max_regenerations = 1     # regeneraciones tras la revisión antes del respaldo
converse_max_tokens = 220
converse_timeout_seconds = 8
review_llm = false        # juez LLM en línea (desactivado por latencia)
delivery = "sentences"    # spec 021: frases revisadas una por una; complete: respuesta entera (spec 020)
sentence_max_chars = 220  # fragmento máximo sin cierre de frase
first_fragment_chars = 160  # el primer fragmento llega antes
stream_first_timeout_seconds = 8  # espera máxima hasta el primer texto del modelo
stream_idle_timeout_seconds = 6   # espera máxima sin texto nuevo a mitad de la respuesta

[jev]                      # gatekeeper System One (spec 022); la clave va en .env: TYPESAFE_API_KEY
enabled = false           # MANUELITA_JEV_ENABLED=1|0 lo sobrescribe
base_url = "https://api.typesafe.ai"
model = "jev-1.14.0"      # versión fija, nunca un alias «latest» (FR-012)
route_threshold = 0.75    # probabilidad mínima de la ruta para decidir sin el clasificador LLM
crisis_threshold = 0.5    # P(crisis) que suma una crisis a la detección determinista
timeout_seconds = 2.0     # sin reintentos dentro del turno
max_input_chars = 4000    # texto enviado (mensaje + historial, se recorta primero el historial)
signals = ["route", "scope", "annoyance", "crisis"]

[state]
env_var = "MANUELITA_STATE_DIR"    # checkpointer y Store, siempre fuera del repositorio

[channels]                 # canal WhatsApp por OpenClaw (spec 024); el token va en .env: VALERIA_CHANNEL_TOKEN
enabled = true
reply_max_chars = 1500    # caracteres por mensaje de WhatsApp (el canal admite 4000)
max_messages = 4          # mensajes por respuesta; el resto se abrevia
approval_ttl_minutes = 10 # vencimiento de una confirmación SÍ/NO pendiente
dedupe_hours = 48         # retención de ids de mensaje ya atendidos
voice_notes = true        # spec 028: notas de voz (transcripción local + respuesta con voz)
bridge_timeout_seconds = 90  # el plugin espera esto antes del modo degradado (cola + voz)
queue_wait_seconds = 60   # espera por el mensaje anterior de la misma persona (nunca se pierde)
voice_max_seconds = 60    # duración máxima de una nota de voz de respuesta
voice_retention_minutes = 10  # los audios generados se borran después de este tiempo
voice_dir = "channels/voice"  # relativo a MANUELITA_STATE_DIR (fuera del repositorio)
# Spec 031: con el canal abierto, límites por número (los operadores de VALERIA_OPERATORS no cuentan)
rate_window_minutes = 10  # ventana corta
rate_max_messages = 20    # mensajes por número en la ventana; luego un aviso amable y silencio
daily_max_messages = 100  # tope diario por número (día local)
# Spec 038: horas sin mensajes tras las que el siguiente abre una conversación nueva (con saludo)
conversation_idle_hours = 12
# Spec 033: minutos tras los que un mensaje recibido tarde se descarta sin responder
stale_minutes = 15
# Spec 034: stickers de Valer-IA en WhatsApp (config/stickers.toml dice cuándo se usa cada uno)
stickers = true
stickers_per_conversation = 8  # máximo por conversación (0 = sin stickers); spec 037: uso activo
