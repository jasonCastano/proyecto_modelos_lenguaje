# Guion del video pitch de Valer-IA (spec 028; v2 sincronizada: spec 029). Seis bloques de elevator pitch.
#
# Reglas (pml pitch validate):
# - narration: español, como máximo 40 palabras; manda la duración total (narración + pausas ≤ max_seconds);
# - claims: unit_id del oro que respaldan lo que se afirma de Manuelita; cada cifra debe estar en ellas;
# - si un bloque menciona la planificación, narration dice «datos sintéticos»;
# - el bloque uso nombra perfil, pregunta, fuentes y planificación;
# - on_screen sin pasos numerados (FR-004): los perfiles van como gráficos del montaje.
#
# Momentos sincronizados ([[block.cue]], data-model.md): cuando la narración dice `word`, se ve algo.
# - kind = "plano": el evento ocurre en el plano `shot`; su segundo en el clip se anota en review.anchors;
# - kind = "grafico": el montaje superpone graficos/<graphic>.png, de `from` a `to` (fracciones del cuadro);
# - hold_s: cuánto permanece el gráfico (por defecto, hasta el fin de la escena); offset_s: retraso tras la palabra.
#
# Al cambiar el texto de un bloque, los planos aprobados de ese bloque quedan desactualizados y se revisan de nuevo.

version = "1.2.0"
language = "es"
max_seconds = 60
pause_s = 0.5

# --------------------------------------------------------------------------- 01 gancho
[[block]]
id = "gancho"
narration = "Manuelita nació en 1864 como un trapiche para producir azúcar. Valer-IA te ayuda a conocerla con un agente que cita fuentes."
claims = ["unit_05fb8675575bb5a7"]

[[block.cue]]
id = "gancho.trapiche"
word = "trapiche"
kind = "plano"
shot = "plano-01a"

[[block.cue]]
id = "gancho.valeria"
word = "Valer"
kind = "plano"
shot = "plano-01b"

